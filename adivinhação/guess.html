<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">
        <h1>Jogo de Adivinhação</h1>
        <p>Digite um número de 0 a 99:</p>

        <input type="number" id="inputNumero" min="0" max="99">
        <button onclick="verificar()">Chutar</button>

        <p id="mensagem"></p>

        <p><strong>Números já chutados:</strong></p>
        <p id="chutes"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
